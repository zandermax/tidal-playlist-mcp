[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tidal-playlist-mcp"
version = "0.1.0"
description = "Local MCP server for TIDAL playlists"
requires-python = ">=3.11,<4"
dependencies = [
    "mcp==2.3.0",
    "tidalapi==0.8.11",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0"]

[project.scripts]
tidal-playlist-mcp = "tidal_playlist_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
